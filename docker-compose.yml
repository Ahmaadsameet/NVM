services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nwm-backend
    env_file:
      - .env
    environment:
      # Always keep SQLite in the persistent volume, even with a local .env.
      NWM_DATABASE_PATH: /app/data/nwm.sqlite3
    volumes:
      - nwm-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nwm-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  nwm-data:
