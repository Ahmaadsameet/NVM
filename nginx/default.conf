server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reject private files even if one is accidentally copied into the web root.
    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(env|pem|key|p12|pfx|sqlite3?|db|sql|bak|log)([./-]|$) {
        return 404;
    }

    location ~* (^|/)(credentials[^/]*\.json|[^/]*service[-_]account[^/]*\.json|id_rsa[^/]*|id_ed25519[^/]*)(/|$) {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (js/css/images) are safe to cache forever - the filename changes on every build.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked up immediately.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
